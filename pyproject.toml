[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-patcher"
version = "1.0.0b1"
description = "Universal Enterprise Security & Privacy Hardening Shield for Claude Desktop"
readme = "README.md"
authors = [
    { name = "Claude Patcher Contributors" }
]
license = { text = "Restricted Source-Available Proprietary License (RSAL-1.0)" }
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0"
]
keywords = [
    "claude",
    "claude-desktop",
    "anthropic",
    "anti-ban",
    "privacy",
    "telemetry",
    "hardener",
    "security",
    "webrtc",
    "anti-leak"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities"
]

[project.scripts]
clp = "claude_patcher.cli:main"
claude-patcher = "claude_patcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_patcher*"]
